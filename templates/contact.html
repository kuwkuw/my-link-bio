<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page_title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            maxWidth: {
              bio: "600px",
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body class="min-h-screen text-slate-900">
    <main class="mx-auto max-w-bio px-4 py-10">
      <nav class="flex items-center gap-4">
        <a class="font-semibold text-blue-700 hover:underline" href="{{ url_for('home') }}">Home</a>
        <a class="font-semibold text-blue-700 hover:underline" href="{{ url_for('about') }}">About</a>
      </nav>
      <h1 class="mt-3 text-3xl font-bold">{{ page_title }}</h1>
      <section class="mt-4 grid gap-3 rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
        <p class="text-slate-700">Have a question or want to connect? Feel free to reach out by email.</p>
        <p>
          <span class="font-semibold text-slate-800">Email:</span>
          <a class="font-semibold text-blue-700 hover:underline" href="mailto:hello@example.com">hello@example.com</a>
        </p>
      </section>
    </main>
  </body>
</html>
