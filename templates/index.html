<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page_title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            maxWidth: {
              bio: "600px",
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body class="min-h-screen text-slate-900">
    <main class="mx-auto max-w-bio px-4 py-10">
      <a class="font-semibold text-blue-700 hover:underline" href="{{ url_for('about') }}">About</a>
      <h1 class="mt-3 text-3xl font-bold">{{ page_title }}</h1>

      <form class="mt-6 grid gap-3 rounded-xl border border-slate-200 bg-white p-4 shadow-sm" action="{{ url_for('add_link') }}" method="post">
        <label class="text-sm font-semibold text-slate-700" for="site_name">Site Name</label>
        <input class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none ring-blue-200 focus:ring-4" type="text" id="site_name" name="site_name" required />

        <label class="text-sm font-semibold text-slate-700" for="site_url">URL</label>
        <input class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none ring-blue-200 focus:ring-4" type="url" id="site_url" name="site_url" required />

        <button class="mt-2 w-fit rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700" type="submit">Add Link</button>
      </form>

      <ul class="mt-6 grid list-none gap-3 p-0">
        {% for link in links %}
        <li class="link-card rounded-xl border border-blue-100 bg-white p-4">
          <div class="flex items-center justify-between gap-3">
            <a class="block font-semibold text-slate-800 no-underline hover:text-blue-700" href="{{ link.url }}">{{ link.name }}</a>
            <div class="flex items-center gap-2">
              <a class="rounded-md bg-amber-500 px-3 py-1 text-sm font-semibold text-white no-underline hover:bg-amber-600" href="{{ url_for('edit_link', link_index=loop.index0) }}">Edit</a>
              <form action="{{ url_for('delete_link', link_index=loop.index0) }}" method="post">
                <button class="rounded-md bg-red-600 px-3 py-1 text-sm font-semibold text-white hover:bg-red-700" type="submit">Delete</button>
              </form>
            </div>
          </div>
        </li>
        {% endfor %}
      </ul>
    </main>
  </body>
</html>
