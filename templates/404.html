<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page_title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body class="min-h-screen text-slate-900">
    <main class="mx-auto flex min-h-screen max-w-2xl items-center justify-center px-4 py-10">
      <section class="w-full rounded-xl border border-slate-200 bg-white p-8 text-center shadow-sm">
        <p class="text-sm font-semibold uppercase tracking-wide text-blue-700">Error 404</p>
        <h1 class="mt-2 text-3xl font-bold text-slate-900">Page Not Found</h1>
        <p class="mt-3 text-slate-600">The page you requested does not exist or may have been moved.</p>
        <a class="mt-6 inline-block rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700" href="{{ url_for('home') }}">
          Back to Home
        </a>
      </section>
    </main>
  </body>
</html>
